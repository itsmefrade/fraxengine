<!doctype html>
<meta charset="utf-8">
<title>Overlay probe</title>
<!--
  Does Chrome promote an HDR WebGPU canvas to a macOS CoreAnimation overlay? Open in Chrome started with
  --show-mac-overlay-borders and compare the border colour across configurations (see measurements/records/hdr-canvas-overlay.md).
  Query: format=rgba16float|rgba8unorm|bgra8unorm, cs=display-p3|srgb|rec2100-pq, tm=extended|standard, w=, h=.
  Nothing else on the page: one opaque canvas, no transform, no overlap, no rounded corners.
-->
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; position: absolute; left: 0; top: 0; }
  #info { position: fixed; left: 8px; bottom: 8px; color: #8f8; font: 12px monospace; background: #000; }
</style>
<canvas id="c"></canvas>
<div id="info"></div>
<script type="module">
const q = new URLSearchParams(location.search);
const format = q.get('format') || 'rgba16float', cs = q.get('cs') || 'display-p3', tm = q.get('tm') || 'extended';
const W = +q.get('w') || 1920, H = +q.get('h') || 1080;
const info = document.getElementById('info');
// ?noinfo hides the label too (a second DOM element over the page could break the all-or-nothing CALayer pass).
if (q.has('noinfo')) info.remove();
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
canvas.style.width = W / devicePixelRatio + 'px'; canvas.style.height = H / devicePixelRatio + 'px';
const adapter = await navigator.gpu.requestAdapter();
const device = await adapter.requestDevice();
const ctx = canvas.getContext('webgpu');
const conf = { device, format, alphaMode: 'opaque', colorSpace: cs, toneMapping: { mode: tm } };
try { ctx.configure(conf); } catch (e) { info.textContent = 'configure failed: ' + e.message; throw e; }
const got = ctx.getConfiguration?.() || {};
const label = `format ${format} cs ${got.colorSpace ?? cs} tm ${got.toneMapping?.mode ?? tm} ${W}x${H}`;
if (info.isConnected) info.textContent = label;
console.log(label);
// A moving gradient up to 4x SDR white (extended) or PQ code 0.75, so every frame changes as video would.
const module = device.createShaderModule({ code: `
  struct U { t: f32, hdr: f32 };
  @group(0) @binding(0) var<uniform> u: U;
  @vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
    var p = array(vec2f(-1, -1), vec2f(3, -1), vec2f(-1, 3));
    return vec4f(p[i], 0, 1);
  }
  @fragment fn fs(@builtin(position) p: vec4f) -> @location(0) vec4f {
    let x = fract(p.x / ${W}.0 + u.t);
    let y = p.y / ${H}.0;
    let v = x * u.hdr;
    return vec4f(v * (1.0 - y), v * 0.8, v * y, 1);
  }` });
const pipeline = device.createRenderPipeline({ layout: 'auto', vertex: { module, entryPoint: 'vs' }, fragment: { module, entryPoint: 'fs', targets: [{ format }] }, primitive: { topology: 'triangle-list' } });
const ubuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
const bg = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ubuf } }] });
const hdr = cs === 'rec2100-pq' ? 0.75 : (format === 'rgba16float' && tm === 'extended' ? 4 : 1);
function frame(t) {
  device.queue.writeBuffer(ubuf, 0, new Float32Array([t / 4000, hdr, 0, 0]));
  const enc = device.createCommandEncoder();
  const pass = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] });
  pass.setPipeline(pipeline); pass.setBindGroup(0, bg); pass.draw(3); pass.end();
  device.queue.submit([enc.finish()]);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
