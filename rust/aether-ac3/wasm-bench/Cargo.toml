[package]
name = "aether-ac3-wasm-bench"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
publish = false
description = "Raw-ABI wasm32 export of aether-ac3 used to measure decode speed in Node"

[lib]
crate-type = ["cdylib"]

[dependencies]
aether-ac3 = { path = ".." }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[workspace]
