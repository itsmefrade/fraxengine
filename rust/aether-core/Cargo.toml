[package]
name = "aether-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "LGPL-3.0-only"
description = "Compatibility shim: re-exports aether-dovi and aether-player under the old module paths (kept so frozen experiments still build)"

[lib]
crate-type = ["rlib"]

[dependencies]
aether-dovi = { path = "../aether-dovi", default-features = false }
aether-player = { path = "../aether-player" }

[features]
default = []
semantic-rpu = ["aether-dovi/semantic-rpu"]
