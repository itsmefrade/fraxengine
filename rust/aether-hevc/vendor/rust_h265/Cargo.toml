[package]
name = "rust_h265"
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
description = "Pure Rust H.265/HEVC video decoder: Main, Main 10 and the 4:2:0 / 4:4:4 range-extension profiles up to 12-bit, multithreaded"
license = "MIT OR Apache-2.0"
repository = "https://github.com/roticv/rust_h265"
readme = "README.md"
keywords = ["hevc", "h265", "video", "decoder", "codec"]
categories = ["multimedia::video"]
# Test fixtures and development tooling stay in the repository: the
# library needs none of them, and testdata is most of the package size.
exclude = ["testdata/", "tools/", ".github/", "CLAUDE.md"]

[dependencies]

# Upstream dev-dependencies (sha2, minifb) and the play / bench_realworld examples are dropped in
# this vendored copy; its in-source tests that need sha2 are compiled out.

[features]
# Disables the SIMD kernels (simd128 / NEON) so the portable code runs: for A/B timing and cross-checks.
scalar = []
# wasm32 only: decoder threads on host workers sharing one imported shared memory (src/thr.rs).
wasm-threads = []
legacy_residual = []
# Reconstruction command stream (GPU reconstruction, docs/rust-browser-port/FEL-CEKIRDEK-PLANI-TR.md G0): records
# every prediction, residual and loop filter input of each picture (src/recon.rs). Off by default; nothing is
# compiled in without it.
recon-stream = []
