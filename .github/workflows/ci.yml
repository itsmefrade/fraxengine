name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Linux is enough: the WASM output is target independent and no test here needs a GPU or the lab media
    # (those skip with a message). Browser pages and GPU checks run locally in Chrome on macOS.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust/aether-hevc
            rust/aether-dtsuhd
            rust/gpu-recon-ref
            rust/gpu-recon-ref-filters
            rust/gpu-recon-ref-intra
            rust/gpu-recon-ref-mc
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build WASM
        run: sh scripts/build.sh
      - name: Check the deployable site assembles (static import scan, no browser)
        run: python3 -I web/dist-tools/assemble.py --no-source
      - name: Tests
        run: sh scripts/test.sh
      - name: Upload WASM
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: |
            web/wasm/*.wasm
            web/exact/wasm/*.wasm
          retention-days: 7
